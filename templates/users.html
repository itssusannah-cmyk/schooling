{% extends "base.html" %}{% block content %}<div class="eyebrow">SYSTEM CONTROL</div><h1 class="heading">User management</h1><p class="muted">Review accounts and assign platform roles.</p><section class="panel full"><table class="table"><tr><th>Name</th><th>Email</th><th>Current role</th><th>Change role</th></tr>{% for u in users %}<tr><td>{{ u.name }}</td><td>{{ u.email }}</td><td>{{ u.role }}</td><td>{% if u.id != me.id %}<form method="post" action="{{ url_for('promote',uid=u.id) }}"><select name="role"><option value="student" {{ 'selected' if u.role=='student' }}>Student</option><option value="teacher" {{ 'selected' if u.role=='teacher' }}>Teacher</option><option value="admin" {{ 'selected' if u.role=='admin' }}>Admin</option></select> <button class="btn secondary">Save</button></form>{% else %}Current account{% endif %}</td></tr>{% endfor %}</table></section>{% endblock %}
